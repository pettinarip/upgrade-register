name: Extract events from new calls
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      call:
        description: "Call ref to extract, e.g. acde/245 (empty = oldest pending)"
        required: false
# Bulk-dispatching a batch of calls should queue, not run a dozen agents at once.
concurrency:
  group: extract-call
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/fetch/pm-calls.mjs
      - run: npm run build   # writes dist/resolve.json, the agent's name-to-id table
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CALL="${{ inputs.call }}"
          if [ -z "$CALL" ]; then
            # A call with a PR already open is done as far as this job is concerned. Without
            # this the queue head-blocks on review: the file is not on main, so every run
            # re-extracts the same call and never reaches the next one.
            gh pr list --state open --limit 100 --json headRefName --jq '.[].headRefName' \
              | sed -n 's|^events/||p' > /tmp/open-calls.txt
            CALL=$(node scripts/new-calls.mjs | grep -vxF -f /tmp/open-calls.txt | head -n1)
          fi
          echo "call=$CALL" >> "$GITHUB_OUTPUT"
      - if: steps.pick.outputs.call != ''
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Without this the action tries to mint a token for the Claude GitHub App,
          # which is not installed here.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            CALL_REF=${{ steps.pick.outputs.call }}
            Follow agent/extract-call.md for this call. Write the events file and run npm test.
          claude_args: "--allowedTools Read,Write,Edit,Bash(npm test),Bash(npm run build),Bash(curl *),WebFetch"
      - if: steps.pick.outputs.call != ''
        uses: peter-evans/create-pull-request@v7
        with:
          branch: events/${{ steps.pick.outputs.call }}
          title: "events: ${{ steps.pick.outputs.call }}"
          commit-message: "events: ${{ steps.pick.outputs.call }}"
          body: "Agent-extracted events for ${{ steps.pick.outputs.call }}. Review each quote against the recording before merging."
          add-paths: upgrades/events
