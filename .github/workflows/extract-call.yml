name: Extract events from new calls
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      call:
        description: "Call ref to extract, e.g. acde/245 (empty = oldest pending)"
        required: false
      model:
        description: "Model override for this run (empty = repo default)"
        required: false
      dry_run:
        description: "Upload the result as an artifact instead of opening a pull request"
        type: boolean
        default: false
# Bulk-dispatching a batch of calls should queue, not run a dozen agents at once.
concurrency:
  group: extract-${{ inputs.dry_run && inputs.model || 'call' }}
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/fetch/pm-calls.mjs
      - run: npm run build   # writes dist/resolve.json, the agent's name-to-id table
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CALL="${{ inputs.call }}"
          if [ -z "$CALL" ]; then
            # A call with a PR already open is done as far as this job is concerned. Without
            # this the queue head-blocks on review: the file is not on main, so every run
            # re-extracts the same call and never reaches the next one.
            gh pr list --state open --limit 100 --json headRefName --jq '.[].headRefName' \
              | sed -n 's|^events/||p' > /tmp/open-calls.txt
            CALL=$(node scripts/new-calls.mjs | grep -vxF -f /tmp/open-calls.txt | head -n1)
          fi
          echo "call=$CALL" >> "$GITHUB_OUTPUT"
          echo "slug=${CALL//\//-}" >> "$GITHUB_OUTPUT"
      - if: steps.pick.outputs.call != ''
        id: extract
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL || 'https://api.anthropic.com/v1' }}
          EXTRACT_MODEL: ${{ inputs.model || vars.EXTRACT_MODEL || 'claude-sonnet-4-6' }}
        run: |
          set -o pipefail
          node scripts/extract-call.mjs "${{ steps.pick.outputs.call }}" | tee /tmp/extract.log
          { echo "body<<EOF"; sed -n '/## Review checklist/,$p' /tmp/extract.log; echo EOF; } >> "$GITHUB_OUTPUT"
      - if: inputs.dry_run && steps.pick.outputs.call != ''
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ steps.pick.outputs.slug }}
          path: |
            upgrades/events/*.json
            /tmp/extract.log
          if-no-files-found: ignore
      - if: ${{ !inputs.dry_run && steps.pick.outputs.call != '' }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: events/${{ steps.pick.outputs.call }}
          title: "events: ${{ steps.pick.outputs.call }}"
          commit-message: "events: ${{ steps.pick.outputs.call }}"
          body: |
            Agent-extracted events for ${{ steps.pick.outputs.call }}. Check each quote against the recording before merging.

            ${{ steps.extract.outputs.body }}
          add-paths: upgrades/events
