name: Probe reachable models
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "--- auth and credit:"
          curl -s https://openrouter.ai/api/v1/key -H "Authorization: Bearer $KEY" | head -c 400; echo
          echo "--- reachability via the anthropic-compatible endpoint (1 token each):"
          for m in anthropic/claude-sonnet-5 anthropic/claude-sonnet-4.6 anthropic/claude-sonnet-4.5 \
                   anthropic/claude-haiku-4.5 anthropic/claude-opus-4.5; do
            code=$(curl -s -o /tmp/r.json -w '%{http_code}' https://openrouter.ai/api/v1/messages \
              -H "Authorization: Bearer $KEY" -H 'content-type: application/json' \
              -d "{\"model\":\"$m\",\"max_tokens\":1,\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}")
            printf '%-32s %s %s\n' "$m" "$code" "$(head -c 160 /tmp/r.json | tr -d '\n')"
          done
