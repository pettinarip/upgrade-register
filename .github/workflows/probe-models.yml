name: Probe reachable models
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "length: ${#KEY}"
          echo "trimmed length: $(printf '%s' "$KEY" | tr -d '[:space:]' | wc -c)"
          echo "starts with sk-or: $(printf '%s' "$KEY" | grep -c '^sk-or' || true)"
          echo "starts with sk-ant: $(printf '%s' "$KEY" | grep -c '^sk-ant' || true)"
          CLEAN=$(printf '%s' "$KEY" | tr -d '[:space:]')
          echo "--- openrouter /key with trimmed value:"
          curl -s https://openrouter.ai/api/v1/key -H "Authorization: Bearer $CLEAN" | head -c 300; echo
          echo "--- anthropic api with trimmed value:"
          curl -s -o /tmp/a.json -w 'status %{http_code} ' https://api.anthropic.com/v1/messages \
            -H "x-api-key: $CLEAN" -H 'anthropic-version: 2023-06-01' -H 'content-type: application/json' \
            -d '{"model":"claude-sonnet-4-5","max_tokens":1,"messages":[{"role":"user","content":"hi"}]}'
          head -c 200 /tmp/a.json; echo
