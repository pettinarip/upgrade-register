name: Mirror upstream data
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
      - name: Commit mirror changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add all-forks.json upgrades/mirror upgrades/cuts upgrades/events/config-*.json
          git diff --cached --quiet || git commit -m "chore(mirror): refresh upstream snapshots" && git push
