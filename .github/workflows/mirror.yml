name: Mirror
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mirror
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run mirror
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
      - name: Commit snapshots and bot events
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add mirror events/meta events/config
          git diff --cached --quiet || { git commit -m "mirror: refresh upstream snapshots" && git push; }
